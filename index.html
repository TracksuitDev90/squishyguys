<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12122b">
  <meta name="description" content="Squishy Guys — drop, squish and merge colorful jelly balls to reach the rainbow!">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Squishy Guys</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2255%22 r=%2240%22 fill=%22%232ECC71%22 stroke=%22%2327AE60%22 stroke-width=%224%22/><ellipse cx=%2238%22 cy=%2240%22 rx=%2212%22 ry=%227%22 fill=%22white%22 opacity=%220.5%22/></svg>">

  <!-- Hand-drawn font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Patrick Hand', cursive;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game {
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }

    /* Prevent pull-to-refresh on mobile */
    body {
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Matter.js physics engine (vendored — no CDN dependency, works offline) -->
  <script src="js/vendor/matter.min.js"></script>

  <!-- Game modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
